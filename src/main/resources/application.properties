# ===================================================================
# SMART STUDENT INFORMATION SYSTEM - APPLICATION CONFIGURATION
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# NOTE: Replace 'YOUR_USERNAME' and 'YOUR_PASSWORD' with your actual MySQL credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration
# -------------------------------------------------------------------
# ddl-auto options: 'update' automatically updates tables; 'validate' validates schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Spring Web Services (SOAP) Configuration
# -------------------------------------------------------------------
# SOAP dispatcher servlet path
spring.webservices.path=/ws

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartstudent.sis=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.ws=DEBUG
